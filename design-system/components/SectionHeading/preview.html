<!-- @dsCard group="排版" height=280 subtitle="帶狀頁首與 2px 區塊標題兩個層級" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  html, body { margin: 0; }
  body { background: var(--surface-page); color: var(--ink); font-family: var(--font-sans); }
  .band { background: var(--accent); border-bottom: var(--border-hair) solid var(--accent-edge); padding: var(--space-5) var(--space-5) var(--space-4); }
  .over { font-family: var(--font-num); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.16em; color: var(--ink-on-band); }
  h1 { margin: var(--space-1) 0 0; font-size: 36px; line-height: 44px; font-weight: 900; }
  .band p { margin: var(--space-1) 0 0; font-size: 15px; line-height: 24px; color: var(--ink-on-band); }
  .body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
  .sec { display: flex; align-items: baseline; gap: var(--space-3); padding-bottom: var(--space-2); border-bottom: var(--border-rule) solid var(--ink); }
  h2 { margin: 0; flex-grow: 1; font-size: 18px; line-height: 26px; font-weight: 700; }
  .eyebrow { font-family: var(--font-num); font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted); }
  .ok { font-size: 14px; line-height: 22px; font-weight: 500; color: var(--success); }
  p.b { margin: var(--space-3) 0 0; font-size: 15px; line-height: 24px; }
</style>

<div class="band">
  <div class="over">AUTUMN 2026 · 12 SESSIONS</div>
  <h1>秋季班報名</h1>
  <p>額滿為止。選好地區與館別，再點月曆上有短橫的日期。</p>
</div>

<div class="body">
  <div>
    <div class="sec"><h2>報名資料</h2><span class="eyebrow">YOUR DETAILS</span></div>
    <p class="b">區塊標題下一定接 2px ink 分隔線，英文對照靠右，兩者基線對齊。</p>
  </div>
  <div>
    <div class="sec"><h2>上課資訊</h2><span class="ok">已付款</span></div>
    <p class="b">右側也可以改放狀態文字，但一個標題只放一樣東西，不要英文和狀態同時出現。</p>
  </div>
</div>
