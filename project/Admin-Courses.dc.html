<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>後台・課程／時段管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #faf7f3; color: #2f4a6d; font-family: "Zen Maru Gothic", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
a { color: #2f4a6d; } a:hover { color: #dd94a2; }
</style>
</helmet>
<div style="width: 1440px; height: 1000px; background: #faf7f3; display: flex; overflow: hidden;">

  <div style="width: 240px; flex-shrink: 0; background: #ffffff; border-right: 2px solid #2f4a6d; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px;">
    <div style="padding: 0 8px; display: flex; flex-direction: column;">
      <span style="font-size: 22px; line-height: 30px; font-weight: 700;">弘淇羽球</span>
      <span style="font-size: 13px; line-height: 20px; color: #5c748f;">後台管理</span>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 8px;">
      <a href="Admin-Courses.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 16px; border: 2px solid #2f4a6d; border-radius: 12px; box-shadow: 0 3px 0 #dd94a2; background: #f2c2cb; color: #24405f; font-size: 15px; line-height: 26px; font-weight: 700; text-decoration: none;">課程／時段</a>
      <a href="Admin-Coaches.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 16px; border: 2px solid transparent; border-radius: 12px; font-size: 15px; line-height: 26px; text-decoration: none;">教練</a>
      <a href="Admin-Venues.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 16px; border: 2px solid transparent; border-radius: 12px; font-size: 15px; line-height: 26px; text-decoration: none;">地點</a>
      <a href="Admin-Orders.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 16px; border: 2px solid transparent; border-radius: 12px; font-size: 15px; line-height: 26px; text-decoration: none;">訂單</a>
      <a href="Admin-Account.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 16px; border: 2px solid transparent; border-radius: 12px; font-size: 15px; line-height: 26px; text-decoration: none;">帳號</a>
    </nav>
    <span style="flex-grow: 1;"></span>
    <div style="padding: 0 8px; display: flex; flex-direction: column;">
      <span style="font-size: 13px; line-height: 20px; color: #5c748f;">管理員</span>
      <span style="font-size: 15px; line-height: 26px; font-weight: 700;">admin@[網域]</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">

    <div style="height: 80px; flex-shrink: 0; padding: 0 32px; display: flex; align-items: center; gap: 16px; background: #ffffff; border-bottom: 2px solid #2f4a6d;">
      <h1 style="margin: 0; flex-grow: 1; font-size: 32px; line-height: 40px; font-weight: 700;">課程／時段管理</h1>
      <button type="button" style="height: 48px; padding: 0 28px; background: #f2c2cb; color: #24405f; border: 2px solid #2f4a6d; border-radius: 12px; box-shadow: 0 4px 0 #dd94a2; font-family: inherit; font-size: 15px; line-height: 26px; font-weight: 700; cursor: pointer;">新增課程</button>
    </div>

    <div style="flex-grow: 1; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 20px;">

      <div style="background: #ffffff; border: 2px solid #2f4a6d; border-radius: 20px; box-shadow: 0 4px 0 #2f4a6d; padding: 16px 24px; display: flex; align-items: center; gap: 16px;">
        <div role="group" aria-label="課程類型" style="display: flex; gap: 8px;">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
            <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.sel}}" style="{{t.style}}">{{t.name}}</button>
          </sc-for>
        </div>
        <div style="width: 1px; height: 32px; background: #ccd8e4;"></div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <label for="a-place" style="font-size: 15px; line-height: 26px; font-weight: 700;">地點</label>
          <select id="a-place" value="{{place}}" onChange="{{setPlace}}" style="height: 44px; padding: 0 12px; background: #f0eae3; border: 2px solid #2f4a6d; border-radius: 12px; font-family: inherit; font-size: 15px; color: #2f4a6d;">
            <option value="">全部地點</option>
            <option value="永康館">永康館</option>
            <option value="東寧館">東寧館</option>
            <option value="仁德館">仁德館</option>
          </select>
        </div>
        <span style="flex-grow: 1; font-size: 15px; line-height: 26px; color: #5c748f;">{{countText}}</span>
        <p style="margin: 0; max-width: 300px; font-size: 13px; line-height: 20px; color: #5c748f;">下一季開課？用每列的「複製」建一份，再改日期就好。</p>
      </div>

      <div style="background: #ffffff; border: 2px solid #2f4a6d; border-radius: 20px; box-shadow: 0 4px 0 #2f4a6d; padding: 24px; display: flex; flex-direction: column;">

        <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) 84px minmax(0, 1fr) minmax(0, 1.5fr) 92px 96px 100px 128px; gap: 12px; align-items: center; padding-bottom: 12px;">
          <span style="font-size: 13px; line-height: 20px; color: #5c748f;">名稱</span>
          <span style="font-size: 13px; line-height: 20px; color: #5c748f;">類型</span>
          <span style="font-size: 13px; line-height: 20px; color: #5c748f;">地點・教練</span>
          <span style="font-size: 13px; line-height: 20px; color: #5c748f;">日期時段</span>
          <span style="font-size: 13px; line-height: 20px; color: #5c748f;">名額</span>
          <span style="font-size: 13px; line-height: 20px; color: #5c748f;">價格</span>
          <span style="font-size: 13px; line-height: 20px; color: #5c748f;">上下架</span>
          <span style="font-size: 13px; line-height: 20px; color: #5c748f;">操作</span>
        </div>

        <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
          <div style="{{r.rowStyle}}">
            <span style="font-size: 15px; line-height: 26px; font-weight: 700;">{{r.name}}</span>
            <span style="{{r.typeStyle}}">{{r.type}}</span>
            <span style="font-size: 15px; line-height: 26px;">{{r.place}}</span>
            <span style="font-size: 15px; line-height: 26px;">{{r.when}}</span>
            <span style="{{r.seatStyle}}">{{r.seats}}</span>
            <span style="font-size: 15px; line-height: 26px; font-weight: 700;">{{r.price}}</span>
            <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.live}}" style="{{r.liveStyle}}">{{r.liveText}}</button>
            <div style="display: flex; gap: 8px;">
              <button type="button" aria-label="{{r.copyLabel}}" style="height: 40px; padding: 0 12px; background: #ffffff; color: #2f4a6d; border: 2px solid #2f4a6d; border-radius: 12px; box-shadow: 0 3px 0 #2f4a6d; font-family: inherit; font-size: 13px; line-height: 20px; font-weight: 700; cursor: pointer;">複製</button>
              <button type="button" aria-label="{{r.editLabel}}" style="height: 40px; padding: 0 12px; background: #bcd9ec; color: #24405f; border: 2px solid #2f4a6d; border-radius: 12px; box-shadow: 0 3px 0 #7fb3d3; font-family: inherit; font-size: 13px; line-height: 20px; font-weight: 700; cursor: pointer;">編輯</button>
            </div>
          </div>
        </sc-for>

      </div>

      <p style="margin: 0; font-size: 13px; line-height: 20px; color: #5c748f;">名額顯示「已報名 / 總名額」。下架的課程不會出現在前台，已報名的人不受影響。</p>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'all', place: '', off: { c8: true } };
  }
  renderVals() {
    var self = this;
    var COURSES = [
      { id: 'c1', name: '成人初級班', type: '季課程', place: '永康館・林彥廷', venue: '永康館', when: '週二 19:00–21:00', taken: 12, cap: 15, price: 'NT$4,800' },
      { id: 'c2', name: '成人進階班', type: '季課程', place: '永康館・陳怡君', venue: '永康館', when: '週四 19:00–21:00', taken: 10, cap: 15, price: 'NT$4,800' },
      { id: 'c3', name: '樂齡羽球班', type: '季課程', place: '永康館・張雅婷', venue: '永康館', when: '週四 14:00–15:30', taken: 12, cap: 12, price: 'NT$3,200' },
      { id: 'c4', name: '兒童啟蒙班', type: '季課程', place: '永康館・黃柏勛', venue: '永康館', when: '週六 09:00–10:30', taken: 6, cap: 12, price: 'NT$3,600' },
      { id: 'c5', name: '青少年培訓班', type: '季課程', place: '東寧館・黃柏勛', venue: '東寧館', when: '週一 18:30–20:30', taken: 14, cap: 16, price: 'NT$5,200' },
      { id: 'c6', name: '單堂體驗課', type: '單堂', place: '東寧館・張雅婷', venue: '東寧館', when: '10/09 20:00–22:00', taken: 2, cap: 8, price: 'NT$450' },
      { id: 'c7', name: '單堂體驗課', type: '單堂', place: '仁德館・黃柏勛', venue: '仁德館', when: '10/11 09:00–11:00', taken: 8, cap: 8, price: 'NT$450' },
      { id: 'c8', name: '一對一指導', type: '單堂', place: '永康館・林彥廷', venue: '永康館', when: '依教練排班', taken: 0, cap: 0, price: 'NT$1,200' }
    ];
    var TABS = [{ id: 'all', name: '全部' }, { id: '季課程', name: '季課程' }, { id: '單堂', name: '單堂' }];
    var tabs = TABS.map(function (t) {
      var on = t.id === self.state.type;
      return {
        name: t.name,
        sel: on,
        pick: function () { self.setState({ type: t.id }); },
        style: 'height:44px;padding:0 20px;border:2px solid #2f4a6d;border-radius:999px;font-family:inherit;font-size:15px;line-height:26px;font-weight:700;cursor:pointer;' + (on ? 'background:#f2c2cb;color:#24405f;box-shadow:0 3px 0 #dd94a2;' : 'background:#ffffff;color:#2f4a6d;')
      };
    });
    var list = COURSES.filter(function (c) {
      return (self.state.type === 'all' || c.type === self.state.type) && (!self.state.place || c.venue === self.state.place);
    });
    var rows = list.map(function (c, i) {
      var live = !self.state.off[c.id];
      var full = c.cap > 0 && c.taken >= c.cap;
      var seatColor = full ? '#b04747' : '#2f4a6d';
      var tintBg = c.type === '季課程' ? '#fbe8ec' : '#e9f2f8';
      return {
        name: c.name, type: c.type, place: c.place, when: c.when, price: c.price,
        seats: c.cap === 0 ? '依預約' : (full ? c.taken + ' / ' + c.cap + '（滿）' : c.taken + ' / ' + c.cap),
        seatStyle: 'font-size:15px;line-height:26px;font-weight:700;color:' + seatColor + ';',
        typeStyle: 'justify-self:start;display:inline-flex;align-items:center;height:26px;padding:0 8px;background:' + tintBg + ';border-radius:8px;font-size:13px;line-height:20px;font-weight:700;',
        rowStyle: 'display:grid;grid-template-columns:minmax(0,1.4fr) 84px minmax(0,1fr) minmax(0,1.5fr) 92px 96px 100px 128px;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #ccd8e4;' + (i % 2 === 1 ? 'background:#faf7f3;' : ''),
        live: live,
        liveText: live ? '上架中' : '已下架',
        liveStyle: 'height:40px;padding:0 10px;border-radius:999px;font-family:inherit;font-size:13px;line-height:20px;font-weight:700;cursor:pointer;' + (live ? 'background:#ffffff;border:2px solid #3f7f68;color:#3f7f68;' : 'background:#f0eae3;border:2px solid #5c748f;color:#5c748f;'),
        toggle: function () {
          var next = {};
          for (var k in self.state.off) { next[k] = self.state.off[k]; }
          next[c.id] = !next[c.id];
          self.setState({ off: next });
        },
        copyLabel: '複製 ' + c.name + ' 到下一季',
        editLabel: '編輯 ' + c.name
      };
    });
    return {
      tabs: tabs,
      rows: rows,
      place: this.state.place,
      setPlace: function (e) { self.setState({ place: e.target.value }); },
      countText: '共 ' + rows.length + ' 筆'
    };
  }
}
</script>
</body>
</html>
