<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>查詢報名（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #ffffff; color: #0e1a2b; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
a { color: #0e1a2b; } a:hover { color: #3c4f61; }
</style>
</helmet>
<div style="width: 390px; height: 900px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="background: #b3d9ec; color: #0e1a2b; border-bottom: 1px solid #7996a8; padding: 0 20px 24px; display: flex; flex-direction: column; flex-shrink: 0;">
    <div style="height: 56px; display: flex; align-items: center; gap: 8px;">
      <a href="Main.dc.html" style="font-size: 16px; line-height: 24px; font-weight: 900; letter-spacing: 0.06em; text-decoration: none;">弘淇羽球</a>
      <span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.18em; color: #3c4f61;">BADMINTON</span>
      <a href="BookingList-Mobile.dc.html" style="font-size: 14px; line-height: 22px; color: #3c4f61; text-decoration: none;">單堂預約</a>
    </div>
    <span style="margin-top: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.16em; color: #3c4f61;">MY BOOKING</span>
    <h1 style="margin: 4px 0 0; font-size: 30px; line-height: 38px; font-weight: 900;">查詢我的報名</h1>
    <p style="margin: 6px 0 0; font-size: 14px; line-height: 22px; color: #3c4f61;">用報名時填的手機號碼加訂單編號就能查，不用註冊會員。</p>
  </div>

  <div style="margin: 24px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="q-tel" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #56657a;">手機號碼（必填）</label>
      <input id="q-tel" name="tel" type="tel" placeholder="0912-345-678" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="q-no" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #56657a;">訂單編號（必填）</label>
      <input id="q-no" name="no" type="text" placeholder="HQ-20260920-0137" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
      <span style="font-size: 13px; line-height: 20px; color: #56657a;">訂單編號在報名完成頁與簡訊裡，開頭是 HQ。</span>
    </div>
    <button type="button" onClick="{{search}}" style="height: 52px; background: #b3d9ec; color: #0e1a2b; border: 1px solid #0e1a2b; border-radius: 2px; font-family: inherit; font-size: 17px; line-height: 24px; font-weight: 700; cursor: pointer;">{{btnText}}</button>
  </div>

  <sc-if value="{{blank}}" hint-placeholder-val="{{yes}}">
    <div style="margin: 24px 20px 0; padding: 48px 24px; border: 1px dashed #7996a8; border-radius: 4px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <svg width="64" height="64" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <circle cx="36" cy="46" r="15" fill="#b3d9ec" stroke="#0e1a2b" stroke-width="2"></circle>
        <path d="M36 31 L24 10 M36 31 L36 8 M36 31 L48 10" stroke="#0e1a2b" stroke-width="2" stroke-linecap="round"></path>
        <path d="M24 10 Q36 2 48 10" stroke="#0e1a2b" stroke-width="2" stroke-linecap="round"></path>
      </svg>
      <p style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 700;">還沒有查詢結果</p>
      <p style="margin: 0; text-align: center; font-size: 13px; line-height: 20px; color: #56657a;">填好上面兩欄再按查詢。</p>
    </div>
  </sc-if>

  <sc-if value="{{found}}" hint-placeholder-val="{{no}}">
    <div style="margin: 24px 20px 0;">
      <div style="display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; border-bottom: 2px solid #0e1a2b;">
        <h2 style="margin: 0; flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; line-height: 26px; font-weight: 700;">HQ-20260920-0137</h2>
        <span style="font-size: 13px; line-height: 20px; font-weight: 500; color: #3f7f68;">已付款</span>
      </div>
      <div style="padding-top: 12px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; gap: 12px;"><span style="width: 52px; flex-shrink: 0; font-size: 13px; line-height: 22px; color: #56657a;">課程</span><span style="font-size: 14px; line-height: 22px; font-weight: 700;">成人進階班（季課程）</span></div>
        <div style="display: flex; gap: 12px;"><span style="width: 52px; flex-shrink: 0; font-size: 13px; line-height: 22px; color: #56657a;">時段</span><span style="font-size: 14px; line-height: 22px;">永康館・每週四 <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700;">19:00–21:00</span>，共 12 堂</span></div>
        <div style="display: flex; gap: 12px;"><span style="width: 52px; flex-shrink: 0; font-size: 13px; line-height: 22px; color: #56657a;">學員</span><span style="font-size: 14px; line-height: 22px;">王小明・0912-345-678</span></div>
        <div style="display: flex; gap: 12px;"><span style="width: 52px; flex-shrink: 0; font-size: 13px; line-height: 22px; color: #56657a;">金額</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; line-height: 22px; font-weight: 700;">NT$5,040 <span style="font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 400; color: #56657a;">（含稅）</span></span></div>
        <div style="display: flex; gap: 12px;"><span style="width: 52px; flex-shrink: 0; font-size: 13px; line-height: 22px; color: #56657a;">發票</span><span style="font-size: 14px; line-height: 22px;">統編發票・已開立 IV-38271905</span></div>
        <div style="display: flex; gap: 12px;"><span style="width: 52px; flex-shrink: 0; font-size: 13px; line-height: 22px; color: #56657a;">肖像</span><span style="font-size: 14px; line-height: 22px;">已同意授權活動照片使用</span></div>
      </div>
      <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 6px;">
        <button type="button" style="align-self: flex-start; height: 44px; padding: 0 18px; background: #ffffff; color: #b04747; border: 1px solid #b04747; border-radius: 2px; font-family: inherit; font-size: 15px; line-height: 22px; font-weight: 700; cursor: pointer;">取消這筆報名</button>
        <span style="font-size: 13px; line-height: 20px; color: #56657a;">退費依報名條款的天數級距計算；取消後名額會立刻釋出，無法復原。</span>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { found: false };
  }
  renderVals() {
    var self = this;
    return {
      found: this.state.found,
      blank: !this.state.found,
      btnText: this.state.found ? '重新查詢' : '查詢',
      search: function () { self.setState({ found: !self.state.found }); },
      yes: true,
      no: false
    };
  }
}
</script>
</body>
</html>
