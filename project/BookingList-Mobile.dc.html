<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>單堂預約列表（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #ffffff; color: #0e1a2b; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
a { color: #0e1a2b; } a:hover { color: #3c4f61; }
</style>
</helmet>
<div style="width: 390px; height: 1180px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="background: #b3d9ec; color: #0e1a2b; border-bottom: 1px solid #7996a8; padding: 0 20px 24px; display: flex; flex-direction: column; flex-shrink: 0;">
    <div style="height: 56px; display: flex; align-items: center; gap: 8px;">
      <a href="Main.dc.html" style="font-size: 16px; line-height: 24px; font-weight: 900; letter-spacing: 0.06em; text-decoration: none;">弘淇羽球</a>
      <span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.18em; color: #3c4f61;">BADMINTON</span>
      <a href="Lookup-Mobile.dc.html" style="font-size: 14px; line-height: 22px; color: #3c4f61; text-decoration: none;">查詢報名</a>
    </div>
    <span style="margin-top: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.16em; color: #3c4f61;">SINGLE SESSION</span>
    <h1 style="margin: 4px 0 0; font-size: 30px; line-height: 38px; font-weight: 900;">單堂預約</h1>
    <p style="margin: 6px 0 0; font-size: 14px; line-height: 22px; color: #3c4f61;">先選地區，再挑教練。兩個都可以留「不指定」。</p>
    <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="f-area" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #3c4f61;">地區</label>
        <select id="f-area" value="{{area}}" onChange="{{setArea}}" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
          <option value="">不指定</option>
          <option value="永康區">永康區</option>
          <option value="東區">東區</option>
          <option value="仁德區">仁德區</option>
        </select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="f-coach" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #3c4f61;">教練</label>
        <select id="f-coach" value="{{coach}}" onChange="{{setCoach}}" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
          <option value="">不指定</option>
          <option value="林彥廷">林彥廷</option>
          <option value="陳怡君">陳怡君</option>
          <option value="黃柏勛">黃柏勛</option>
          <option value="張雅婷">張雅婷</option>
        </select>
      </div>
    </div>
  </div>

  <div style="padding: 20px 20px 0; display: flex; align-items: baseline; gap: 10px;">
    <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; line-height: 30px; font-weight: 700;">OPEN SESSIONS</h2>
    <span style="flex-grow: 1;"></span>
    <span style="font-size: 13px; line-height: 18px; font-weight: 500;">{{countText}}</span>
  </div>

  <div style="margin: 12px 20px 0; border-top: 2px solid #0e1a2b; display: flex; flex-direction: column;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="padding: 16px 0; border-bottom: 1px solid #e3e7ec; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px;">
        <div style="display: flex; flex-direction: column;">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; line-height: 26px; font-weight: 700;">{{r.date}}</span>
          <span style="font-size: 13px; line-height: 20px; color: #56657a;">（{{r.wd}}）</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; line-height: 24px; font-weight: 700;">{{r.time}}</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; line-height: 24px; font-weight: 700;">{{r.price}}</span>
          </div>
          <span style="font-size: 13px; line-height: 20px; color: #56657a;">{{r.coach}} 教練・{{r.venue}}（{{r.area}}）</span>
          <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
            <span style="{{r.statusStyle}}">{{r.statusText}}</span>
            <span style="flex-grow: 1;"></span>
            <sc-if value="{{r.open}}" hint-placeholder-val="{{yes}}">
              <a href="Checkout-Mobile.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 18px; background: #b3d9ec; color: #0e1a2b; border: 1px solid #0e1a2b; border-radius: 2px; font-size: 15px; line-height: 22px; font-weight: 700; text-decoration: none;">預約<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 7 H12 M8 3 L12 7 L8 11" stroke="#0e1a2b" stroke-width="2" stroke-linecap="square"></path></svg></a>
            </sc-if>
            <sc-if value="{{r.full}}" hint-placeholder-val="{{no}}">
              <button type="button" disabled style="height: 44px; padding: 0 18px; background: #eef1f4; color: #8a96a5; border: none; border-radius: 2px; font-family: inherit; font-size: 15px; line-height: 22px; font-weight: 700;">額滿</button>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{empty}}" hint-placeholder-val="{{no}}">
      <div style="padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; border-bottom: 1px solid #e3e7ec;">
        <svg width="64" height="64" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <circle cx="36" cy="46" r="15" fill="#b3d9ec" stroke="#0e1a2b" stroke-width="2"></circle>
          <path d="M36 31 L24 10 M36 31 L36 8 M36 31 L48 10" stroke="#0e1a2b" stroke-width="2" stroke-linecap="round"></path>
          <path d="M24 10 Q36 2 48 10" stroke="#0e1a2b" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <p style="margin: 0; font-size: 18px; line-height: 26px; font-weight: 700;">這個條件沒有開放時段</p>
        <p style="margin: 0; text-align: center; font-size: 13px; line-height: 20px; color: #56657a;">把地區或教練改回「不指定」，就能看到全部六個時段。</p>
        <button type="button" onClick="{{clear}}" style="height: 44px; padding: 0 24px; background: #ffffff; color: #0e1a2b; border: 1px solid #0e1a2b; border-radius: 2px; font-family: inherit; font-size: 15px; line-height: 22px; font-weight: 700; cursor: pointer;">清除條件</button>
      </div>
    </sc-if>
  </div>

  <p style="margin: 16px 20px 24px; font-size: 13px; line-height: 20px; color: #56657a;">找整季的班？<a href="Main.dc.html" style="font-weight: 700;">看季課程報名</a></p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { coach: '', area: '' };
  }
  renderVals() {
    var self = this;
    var SESSIONS = [
      { date: '10.06', wd: '二', time: '20:00–22:00', coach: '林彥廷', venue: '永康館', area: '永康區', left: 4, price: 'NT$450' },
      { date: '10.08', wd: '四', time: '19:00–21:00', coach: '陳怡君', venue: '永康館', area: '永康區', left: 1, price: 'NT$450' },
      { date: '10.09', wd: '五', time: '20:00–22:00', coach: '張雅婷', venue: '東寧館', area: '東區', left: 6, price: 'NT$450' },
      { date: '10.11', wd: '日', time: '09:00–11:00', coach: '黃柏勛', venue: '仁德館', area: '仁德區', left: 0, price: 'NT$450' },
      { date: '10.13', wd: '二', time: '20:00–22:00', coach: '林彥廷', venue: '中華館', area: '永康區', left: 5, price: 'NT$450' },
      { date: '10.15', wd: '四', time: '19:00–21:00', coach: '陳怡君', venue: '仁德館', area: '仁德區', left: 3, price: 'NT$450' }
    ];
    var list = SESSIONS.filter(function (s) {
      return (!self.state.coach || s.coach === self.state.coach) && (!self.state.area || s.area === self.state.area);
    });
    var rows = list.map(function (s) {
      var full = s.left === 0;
      var low = !full && s.left <= 3;
      var t = full ? '已額滿' : (low ? '剩 ' + s.left + ' 個名額' : '尚有 ' + s.left + ' 個名額');
      var c = full ? '#b04747' : (low ? '#9a6318' : '#3f7f68');
      return {
        date: s.date, wd: s.wd, time: s.time, coach: s.coach, venue: s.venue, area: s.area, price: s.price,
        open: !full, full: full,
        statusText: t,
        statusStyle: 'font-size:13px;line-height:20px;font-weight:500;color:' + c + ';'
      };
    });
    return {
      coach: this.state.coach,
      area: this.state.area,
      setCoach: function (e) { self.setState({ coach: e.target.value }); },
      setArea: function (e) { self.setState({ area: e.target.value }); },
      clear: function () { self.setState({ coach: '', area: '' }); },
      rows: rows,
      empty: rows.length === 0,
      countText: '共 ' + rows.length + ' 個時段',
      yes: true,
      no: false
    };
  }
}
</script>
</body>
</html>
