<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>結帳（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #ffffff; color: #0e1a2b; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
a { color: #0e1a2b; } a:hover { color: #3c4f61; }
</style>
</helmet>
<div style="width: 390px; height: 1320px; background: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="background: #b3d9ec; color: #0e1a2b; border-bottom: 1px solid #7996a8; padding: 0 20px 24px; display: flex; flex-direction: column; flex-shrink: 0;">
    <div style="height: 56px; display: flex; align-items: center; gap: 12px;">
      <a href="Main.dc.html" aria-label="返回課程資訊" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid #0e1a2b; border-radius: 2px; text-decoration: none;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M14 8 H4 M8 3 L3 8 L8 13" stroke="#0e1a2b" stroke-width="2" stroke-linecap="square"></path></svg>
      </a>
      <span style="flex-grow: 1; font-size: 16px; line-height: 24px; font-weight: 900; letter-spacing: 0.06em;">弘淇羽球</span>
    </div>
    <span style="margin-top: 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.16em; color: #3c4f61;">CHECKOUT</span>
    <h1 style="margin: 4px 0 0; font-size: 30px; line-height: 38px; font-weight: 900;">填寫報名資料</h1>
    <p style="margin: 6px 0 0; font-size: 14px; line-height: 22px; color: #3c4f61;">季課程與單堂預約共用這一頁，填完直接付款。</p>
  </div>

  <div style="margin: 24px 20px 0;">
    <div style="display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; border-bottom: 2px solid #0e1a2b;">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700;">報名項目</h2>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.12em; color: #56657a;">ITEM</span>
    </div>
    <div style="padding: 14px 0; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <h3 style="margin: 0; flex-grow: 1; font-size: 18px; line-height: 26px; font-weight: 700;">成人進階班</h3>
        <span style="font-size: 12px; line-height: 16px; font-weight: 500; padding: 1px 5px; border: 1px solid #0e1a2b; border-radius: 2px;">季課程</span>
      </div>
      <span style="font-size: 13px; line-height: 20px; color: #56657a;">永康館・陳怡君 教練</span>
      <span style="font-size: 13px; line-height: 20px; color: #56657a;">10/08 起 每週四 <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; color: #0e1a2b;">19:00–21:00</span>，共 12 堂</span>
    </div>
  </div>

  <div style="margin: 20px 20px 0;">
    <div style="display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; border-bottom: 2px solid #0e1a2b;">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700;">報名資料</h2>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.12em; color: #56657a;">DETAILS</span>
    </div>
    <div style="padding-top: 14px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="c-name" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #56657a;">姓名（必填）</label>
          <input id="c-name" name="name" type="text" placeholder="王小明" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="c-tel" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #56657a;">手機號碼（必填）</label>
          <input id="c-tel" name="tel" type="tel" placeholder="0912-345-678" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="c-line" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #56657a;">LINE ID</label>
        <input id="c-line" name="line" type="text" placeholder="winson_bd" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="c-level" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #56657a;">程度備註</label>
        <textarea id="c-level" name="level" rows="3" placeholder="球齡幾年、想加強的項目" style="padding: 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; line-height: 24px; color: #0e1a2b; resize: none;"></textarea>
        <span style="font-size: 13px; line-height: 20px; color: #56657a;">教練會照這段話分組，寫兩句就夠。查詢報名時會用到手機號碼。</span>
      </div>
    </div>
  </div>

  <div style="margin: 20px 20px 0;">
    <div style="display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; border-bottom: 2px solid #0e1a2b;">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700;">發票</h2>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.12em; color: #56657a;">INVOICE</span>
    </div>
    <div style="padding-top: 14px; display: flex; flex-direction: column; gap: 12px;">
      <label style="{{r1Style}}">
        <input type="radio" name="inv" value="b2c" checked="{{isB2C}}" onChange="{{pickB2C}}" style="width: 18px; height: 18px; accent-color: #0e1a2b;">
        <span style="flex-grow: 1; font-size: 15px; line-height: 24px; font-weight: 700;">二聯式收據</span>
        <span style="font-size: 13px; line-height: 20px; color: #56657a;">不含稅</span>
      </label>
      <label style="{{r2Style}}">
        <input type="radio" name="inv" value="b2b" checked="{{isB2B}}" onChange="{{pickB2B}}" style="width: 18px; height: 18px; accent-color: #0e1a2b;">
        <span style="flex-grow: 1; font-size: 15px; line-height: 24px; font-weight: 700;">統編發票</span>
        <span style="font-size: 13px; line-height: 20px; color: #56657a;">金額 +5%</span>
      </label>
      <sc-if value="{{isB2B}}" hint-placeholder-val="{{no}}">
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #e9f2f8; border: 1px solid #7996a8; border-radius: 4px;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="c-vat" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #3c4f61;">統一編號（必填）</label>
            <input id="c-vat" name="vat" type="text" inputmode="numeric" placeholder="12345678" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label for="c-title" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #3c4f61;">發票抬頭（必填）</label>
            <input id="c-title" name="title" type="text" placeholder="鳴周科技有限公司" style="height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
          </div>
          <span style="font-size: 13px; line-height: 20px; color: #3c4f61;">統編要八碼數字。發票由中心手開後寄出。</span>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="margin: 20px 20px 0;">
    <div style="display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; border-bottom: 2px solid #0e1a2b;">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700;">金額</h2>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.12em; color: #56657a;">TOTAL</span>
    </div>
    <div style="padding-top: 12px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: baseline;">
        <span style="flex-grow: 1; font-size: 14px; line-height: 22px; color: #56657a;">課程費用</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; line-height: 22px; font-weight: 600;">NT$4,800</span>
      </div>
      <sc-if value="{{isB2B}}" hint-placeholder-val="{{no}}">
        <div style="display: flex; align-items: baseline;">
          <span style="flex-grow: 1; font-size: 14px; line-height: 22px; color: #56657a;">營業稅 5%</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; line-height: 22px; font-weight: 600;">NT$240</span>
        </div>
      </sc-if>
      <div style="height: 1px; background: #e3e7ec; margin: 6px 0;"></div>
      <div style="display: flex; align-items: baseline;">
        <span style="flex-grow: 1; font-size: 15px; line-height: 24px; font-weight: 700;">應付金額</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; line-height: 34px; font-weight: 700;">{{total}}</span>
      </div>
    </div>
  </div>

  <div style="margin: 20px 20px 24px; display: flex; flex-direction: column; gap: 8px;">
    <a href="Done-Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; background: #b3d9ec; color: #0e1a2b; border: 1px solid #0e1a2b; border-radius: 2px; font-size: 17px; line-height: 24px; font-weight: 700; text-decoration: none;">前往付款 {{total}}<svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 7 H12 M8 3 L12 7 L8 11" stroke="#0e1a2b" stroke-width="2" stroke-linecap="square"></path></svg></a>
    <p style="margin: 0; text-align: center; font-size: 13px; line-height: 20px; color: #56657a;">將跳轉至 [金流商名稱] 付款頁，支援信用卡與轉帳。開課前三日可全額退費。</p>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inv: 'b2c' };
  }
  renderVals() {
    var self = this;
    var b2b = this.state.inv === 'b2b';
    var total = b2b ? 5040 : 4800;
    var row = function (on) {
      return 'display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border:1px solid #0e1a2b;border-radius:2px;cursor:pointer;' + (on ? 'background:#b3d9ec;' : 'background:#ffffff;');
    };
    return {
      isB2C: !b2b,
      isB2B: b2b,
      pickB2C: function () { self.setState({ inv: 'b2c' }); },
      pickB2B: function () { self.setState({ inv: 'b2b' }); },
      r1Style: row(!b2b),
      r2Style: row(b2b),
      total: 'NT$' + total.toLocaleString('en-US'),
      no: false
    };
  }
}
</script>
</body>
</html>
