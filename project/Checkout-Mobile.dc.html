<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>結帳（手機）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #faf7f3; color: #2f4a6d; font-family: "Zen Maru Gothic", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
a { color: #2f4a6d; } a:hover { color: #dd94a2; }
</style>
</helmet>
<div style="width: 390px; height: 1320px; background: #faf7f3; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px; background: #ffffff; border-bottom: 2px solid #2f4a6d; flex-shrink: 0;">
    <a href="Main.dc.html" aria-label="返回課程資訊" style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 2px solid #2f4a6d; border-radius: 12px; background: #ffffff; text-decoration: none;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M11 3 L5 9 L11 15" stroke="#2f4a6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <span style="flex-grow: 1; font-size: 18px; line-height: 26px; font-weight: 700;">填寫報名資料</span>
  </div>

  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px;">

    <div style="background: #ffffff; border: 2px solid #2f4a6d; border-radius: 20px; box-shadow: 0 4px 0 #2f4a6d; padding: 16px; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <h2 style="margin: 0; flex-grow: 1; font-size: 18px; line-height: 26px; font-weight: 700;">成人進階班</h2>
        <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 8px; background: #fbe8ec; border-radius: 8px; font-size: 13px; line-height: 20px; font-weight: 700;">季課程</span>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 26px;">永康館・陳怡君 教練</p>
      <p style="margin: 0; font-size: 15px; line-height: 26px;">10/08 起 每週四 19:00–21:00，共 12 堂</p>
    </div>

    <div style="background: #ffffff; border: 2px solid #2f4a6d; border-radius: 20px; box-shadow: 0 4px 0 #2f4a6d; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 700;">報名資料</h2>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="c-name" style="font-size: 15px; line-height: 26px; font-weight: 700;">姓名（必填）</label>
        <input id="c-name" name="name" type="text" placeholder="王小明" style="height: 44px; padding: 0 12px; background: #f0eae3; border: 2px solid #2f4a6d; border-radius: 12px; font-family: inherit; font-size: 15px; color: #2f4a6d;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="c-tel" style="font-size: 15px; line-height: 26px; font-weight: 700;">手機號碼（必填）</label>
        <input id="c-tel" name="tel" type="tel" placeholder="0912-345-678" style="height: 44px; padding: 0 12px; background: #f0eae3; border: 2px solid #2f4a6d; border-radius: 12px; font-family: inherit; font-size: 15px; color: #2f4a6d;">
        <p style="margin: 0; font-size: 13px; line-height: 20px; color: #5c748f;">之後查詢報名狀態會用到這組號碼。</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="c-line" style="font-size: 15px; line-height: 26px; font-weight: 700;">LINE ID</label>
        <input id="c-line" name="line" type="text" placeholder="winson_bd" style="height: 44px; padding: 0 12px; background: #f0eae3; border: 2px solid #2f4a6d; border-radius: 12px; font-family: inherit; font-size: 15px; color: #2f4a6d;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px;">
        <label for="c-level" style="font-size: 15px; line-height: 26px; font-weight: 700;">程度備註</label>
        <textarea id="c-level" name="level" rows="3" placeholder="球齡幾年、想加強的項目" style="padding: 12px; background: #f0eae3; border: 2px solid #2f4a6d; border-radius: 12px; font-family: inherit; font-size: 15px; line-height: 26px; color: #2f4a6d; resize: none;"></textarea>
        <p style="margin: 0; font-size: 13px; line-height: 20px; color: #5c748f;">教練會照這段話分組，寫兩句就夠。</p>
      </div>
    </div>

    <div style="background: #ffffff; border: 2px solid #2f4a6d; border-radius: 20px; box-shadow: 0 4px 0 #2f4a6d; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 700;">發票</h2>

      <label style="{{r1Style}}">
        <input type="radio" name="inv" value="b2c" checked="{{isB2C}}" onChange="{{pickB2C}}" style="width: 20px; height: 20px; accent-color: #dd94a2;">
        <span style="flex-grow: 1; font-size: 15px; line-height: 26px; font-weight: 700;">二聯式收據</span>
        <span style="font-size: 13px; line-height: 20px; color: #5c748f;">不含稅</span>
      </label>

      <label style="{{r2Style}}">
        <input type="radio" name="inv" value="b2b" checked="{{isB2B}}" onChange="{{pickB2B}}" style="width: 20px; height: 20px; accent-color: #dd94a2;">
        <span style="flex-grow: 1; font-size: 15px; line-height: 26px; font-weight: 700;">統編發票</span>
        <span style="font-size: 13px; line-height: 20px; color: #5c748f;">金額 +5%</span>
      </label>

      <sc-if value="{{isB2B}}" hint-placeholder-val="{{no}}">
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 12px; background: #e9f2f8; border-radius: 12px;">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label for="c-vat" style="font-size: 15px; line-height: 26px; font-weight: 700;">統一編號（必填）</label>
            <input id="c-vat" name="vat" type="text" inputmode="numeric" placeholder="12345678" style="height: 44px; padding: 0 12px; background: #ffffff; border: 2px solid #2f4a6d; border-radius: 12px; font-family: inherit; font-size: 15px; color: #2f4a6d;">
            <p style="margin: 0; font-size: 13px; line-height: 20px; color: #5c748f;">統編要八碼數字。</p>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <label for="c-title" style="font-size: 15px; line-height: 26px; font-weight: 700;">發票抬頭（必填）</label>
            <input id="c-title" name="title" type="text" placeholder="鳴周科技有限公司" style="height: 44px; padding: 0 12px; background: #ffffff; border: 2px solid #2f4a6d; border-radius: 12px; font-family: inherit; font-size: 15px; color: #2f4a6d;">
          </div>
        </div>
      </sc-if>
    </div>

    <div style="background: #ffffff; border: 2px solid #2f4a6d; border-radius: 20px; box-shadow: 0 4px 0 #2f4a6d; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: baseline;">
        <span style="flex-grow: 1; font-size: 15px; line-height: 26px;">課程費用</span>
        <span style="font-size: 15px; line-height: 26px;">NT$4,800</span>
      </div>
      <sc-if value="{{isB2B}}" hint-placeholder-val="{{no}}">
        <div style="display: flex; align-items: baseline;">
          <span style="flex-grow: 1; font-size: 15px; line-height: 26px;">營業稅 5%</span>
          <span style="font-size: 15px; line-height: 26px;">NT$240</span>
        </div>
      </sc-if>
      <div style="height: 1px; background: #ccd8e4;"></div>
      <div style="display: flex; align-items: baseline;">
        <span style="flex-grow: 1; font-size: 18px; line-height: 26px; font-weight: 700;">應付金額</span>
        <span style="font-size: 22px; line-height: 30px; font-weight: 700;">{{total}}</span>
      </div>
    </div>

    <a href="Done-Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; background: #f2c2cb; color: #24405f; border: 2px solid #2f4a6d; border-radius: 12px; box-shadow: 0 4px 0 #dd94a2; font-size: 18px; line-height: 26px; font-weight: 700; text-decoration: none;">前往付款 {{total}}</a>
    <p style="margin: 0; text-align: center; font-size: 13px; line-height: 20px; color: #5c748f;">將跳轉至 [金流商名稱] 付款頁，支援信用卡與轉帳。開課前三日可全額退費。</p>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { inv: 'b2c' };
  }
  renderVals() {
    var self = this;
    var b2b = this.state.inv === 'b2b';
    var base = 4800;
    var total = b2b ? Math.round(base * 1.05) : base;
    var row = function (on) {
      return 'display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border:2px solid #2f4a6d;border-radius:12px;cursor:pointer;' + (on ? 'background:#fbe8ec;' : 'background:#ffffff;');
    };
    return {
      isB2C: !b2b,
      isB2B: b2b,
      pickB2C: function () { self.setState({ inv: 'b2c' }); },
      pickB2B: function () { self.setState({ inv: 'b2b' }); },
      r1Style: row(!b2b),
      r2Style: row(b2b),
      total: 'NT$' + total.toLocaleString('en-US'),
      no: false
    };
  }
}
</script>
</body>
</html>
