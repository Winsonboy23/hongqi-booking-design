<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>後台・教練管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #ffffff; color: #0e1a2b; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
a { color: #0e1a2b; } a:hover { color: #3c4f61; }
</style>
</helmet>
<div style="width: 1440px; height: 880px; background: #ffffff; display: flex; overflow: hidden;">

  <aside style="width: 236px; flex-shrink: 0; background: #b3d9ec; border-right: 1px solid #7996a8; display: flex; flex-direction: column;">
    <div style="padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #7996a8;">
      <span style="font-size: 18px; line-height: 26px; font-weight: 900; letter-spacing: 0.06em;">弘淇羽球</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.18em; color: #3c4f61;">ADMIN CONSOLE</span>
    </div>
    <nav style="flex-grow: 1; padding: 14px 0; display: flex; flex-direction: column;">
      <a href="Admin-Courses.dc.html" style="height: 46px; padding: 0 20px; display: flex; align-items: center; color: #3c4f61; font-size: 15px; text-decoration: none;">課程／時段管理</a>
      <a href="Admin-Coaches.dc.html" style="height: 46px; padding: 0 20px; display: flex; align-items: center; background: #ffffff; box-shadow: inset 3px 0 0 #0e1a2b; font-size: 15px; font-weight: 700; text-decoration: none;">教練管理</a>
      <a href="Admin-Venues.dc.html" style="height: 46px; padding: 0 20px; display: flex; align-items: center; color: #3c4f61; font-size: 15px; text-decoration: none;">地點管理</a>
      <a href="Admin-Orders.dc.html" style="height: 46px; padding: 0 20px; display: flex; align-items: center; color: #3c4f61; font-size: 15px; text-decoration: none;">訂單管理</a>
      <a href="Admin-Account.dc.html" style="height: 46px; padding: 0 20px; display: flex; align-items: center; color: #3c4f61; font-size: 15px; text-decoration: none;">管理員帳號</a>
    </nav>
    <div style="padding: 16px 20px 20px; border-top: 1px solid #7996a8; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 14px; line-height: 22px; font-weight: 700;">中心管理員</span>
      <span style="font-size: 13px; line-height: 20px; color: #3c4f61;">admin@hongqi.tw</span>
      <a href="Admin-Account.dc.html" style="margin-top: 6px; font-size: 13px; line-height: 20px; color: #3c4f61;">帳號設定 / 登出</a>
    </div>
  </aside>

  <main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">

    <header style="height: 76px; flex-shrink: 0; padding: 0 32px; border-bottom: 1px solid #e3e7ec; display: flex; align-items: center; gap: 16px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.16em; color: #56657a;">COACHES</span>
        <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 900;">教練管理</h1>
      </div>
      <button type="button" style="height: 44px; padding: 0 20px; background: #b3d9ec; color: #0e1a2b; border: 1px solid #0e1a2b; border-radius: 2px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">＋ 新增教練</button>
    </header>

    <div style="padding: 20px 32px 0; display: flex; align-items: flex-end; gap: 14px;">
      <div style="width: 240px; display: flex; flex-direction: column; gap: 6px;">
        <label for="c-q" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #56657a;">搜尋教練</label>
        <input id="c-q" type="text" placeholder="姓名或專長" style="height: 42px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
      </div>
      <div style="width: 170px; display: flex; flex-direction: column; gap: 6px;">
        <label for="c-venue" style="font-size: 13px; line-height: 18px; font-weight: 500; color: #56657a;">可授課館別</label>
        <select id="c-venue" style="height: 42px; padding: 0 12px; background: #ffffff; border: 1px solid #0e1a2b; border-radius: 4px; font-family: inherit; font-size: 15px; color: #0e1a2b;">
          <option value="">全部館別</option>
          <option value="永康館">永康館</option>
          <option value="中華館">中華館</option>
          <option value="東寧館">東寧館</option>
          <option value="仁德館">仁德館</option>
        </select>
      </div>
      <span style="flex-grow: 1;"></span>
      <span style="margin-bottom: 11px; font-size: 14px; line-height: 22px; font-weight: 700;">{{countText}}</span>
    </div>

    <div style="margin: 18px 32px 0; flex-grow: 1;">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1.1fr) 110px 110px 132px; gap: 14px; align-items: center; padding-bottom: 10px; border-bottom: 2px solid #0e1a2b;">
        <span style="font-size: 13px; line-height: 20px; font-weight: 700;">教練</span>
        <span style="font-size: 13px; line-height: 20px; font-weight: 700;">專長</span>
        <span style="font-size: 13px; line-height: 20px; font-weight: 700;">可授課館別</span>
        <span style="font-size: 13px; line-height: 20px; font-weight: 700;">本季課程</span>
        <span style="font-size: 13px; line-height: 20px; font-weight: 700;">前台顯示</span>
        <span></span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="{{r.rowStyle}}">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; background: #e9f2f8; border: 1px solid #0e1a2b; border-radius: 2px; font-size: 18px; font-weight: 900;">{{r.initial}}</span>
            <div style="display: flex; flex-direction: column;">
              <span style="font-size: 15px; line-height: 22px; font-weight: 700;">{{r.name}}</span>
              <span style="font-size: 12px; line-height: 18px; color: #56657a;">{{r.tel}}</span>
            </div>
          </div>
          <span style="font-size: 14px; line-height: 22px;">{{r.skill}}</span>
          <span style="font-size: 14px; line-height: 22px;">{{r.venues}}</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; line-height: 24px; font-weight: 700;">{{r.classes}} <span style="font-family: 'Noto Sans TC', sans-serif; font-size: 12px; font-weight: 400; color: #56657a;">堂／週</span></span>
          <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.on}}" aria-label="{{r.toggleAria}}" style="{{r.switchStyle}}"><span style="{{r.knobStyle}}"></span></button>
          <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button type="button" style="height: 36px; padding: 0 12px; background: #ffffff; color: #0e1a2b; border: 1px solid #0e1a2b; border-radius: 2px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">編輯</button>
            <button type="button" style="height: 36px; padding: 0 12px; background: #ffffff; color: #b04747; border: 1px solid #b04747; border-radius: 2px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">刪除</button>
          </div>
        </div>
      </sc-for>
      <p style="margin: 16px 0 0; font-size: 13px; line-height: 20px; color: #56657a;">關掉「前台顯示」的教練不會出現在單堂預約的教練下拉選單，既有課程與訂單不受影響。有課程正在進行的教練無法刪除，請先改派或下架該課程。</p>
    </div>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":880}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { off: {} };
  }
  renderVals() {
    var self = this;
    var DATA = [
      { id: '1', name: '林彥廷', initial: '林', tel: '0912-000-111', skill: '成人初階・基礎步法', venues: '永康館、中華館', classes: 3 },
      { id: '2', name: '陳怡君', initial: '陳', tel: '0912-000-222', skill: '成人進階・雙打戰術', venues: '永康館、仁德館', classes: 3 },
      { id: '3', name: '黃柏勛', initial: '黃', tel: '0912-000-333', skill: '兒童啟蒙・青少年培訓', venues: '永康館、東寧館', classes: 2 },
      { id: '4', name: '張雅婷', initial: '張', tel: '0912-000-444', skill: '樂齡班・體能調整', venues: '永康館、東寧館', classes: 2 }
    ];
    var rows = DATA.map(function (d) {
      var on = !self.state.off[d.id];
      return {
        name: d.name, initial: d.initial, tel: d.tel, skill: d.skill, venues: d.venues, classes: d.classes,
        on: on,
        rowStyle: 'display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.1fr) 110px 110px 132px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #e3e7ec;' + (on ? '' : 'opacity:0.58;'),
        switchStyle: 'justify-self:start;width:56px;height:30px;padding:3px;display:flex;align-items:center;border-radius:2px;cursor:pointer;'
          + (on ? 'background:#b3d9ec;border:1px solid #0e1a2b;justify-content:flex-end;' : 'background:#eef1f4;border:1px solid #a3adba;justify-content:flex-start;'),
        knobStyle: 'display:block;width:22px;height:22px;border-radius:1px;background:' + (on ? '#0e1a2b' : '#8a96a5') + ';',
        toggleAria: d.name + (on ? '，前台顯示中' : '，前台已隱藏'),
        toggle: function () {
          var o = {};
          for (var k in self.state.off) { if (self.state.off.hasOwnProperty(k)) { o[k] = self.state.off[k]; } }
          if (o[d.id]) { delete o[d.id]; } else { o[d.id] = true; }
          self.setState({ off: o });
        }
      };
    });
    return { rows: rows, countText: '共 ' + rows.length + ' 位教練', yes: true, no: false };
  }
}
</script>
</body>
</html>
