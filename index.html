<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弘淇羽球報名系統 — 介面設計稿</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f4a6d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 簡約風：取自 project/Main-Minimal-A.dc.html（簡約 A・清爽）——白底、1px 細線、8px 圓角、無陰影、
   思源黑體，深藍是唯一主色，文字一律黑色。只換畫廊外框，畫板本身不動。 */
:root {
  --bg: #ffffff;          /* 頁面底 */
  --bg-soft: #f1f3f6;     /* 縮圖底：比頁面深一階，畫板像放在桌面上 */
  --card: #ffffff;
  --ink: #000000;         /* 文字一律黑色 */
  --muted: #555555;       /* 小標籤 */
  --faint: #767676;       /* 註記：尺寸、張數 */
  --line: #e1e5ea;        /* 分隔線、卡片外框 */
  --line-strong: #cfd6de; /* 控制項外框 */
  --primary: #2f4a6d;     /* 唯一主色：選中分頁 */
  --tabbar-h: 58px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size: 15px;
  line-height: 26px;
  font-variant-numeric: tabular-nums;
}

/* ---------- 頁首 ---------- */
header { padding: 48px 24px 28px; max-width: 1400px; margin: 0 auto; }
.brand { margin: 0 0 10px; font-size: 13px; line-height: 20px; font-weight: 700; letter-spacing: .12em; color: var(--ink); }
h1 { margin: 0; font-size: 28px; line-height: 38px; font-weight: 700; }

/* ---------- 分頁列 ---------- */
.tabs {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.tabs-inner {
  max-width: 1400px; margin: 0 auto; padding: 10px 24px;
  display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  min-height: var(--tabbar-h);
}
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 14px;
  background: transparent; color: var(--ink);
  border: 0; border-radius: 8px;
  font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
}
.tab:hover { background: var(--bg-soft); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--primary); color: #fff; }
.tab .count { font-size: 12px; line-height: 18px; color: var(--faint); }
.tab[aria-selected="true"] .count { color: #ffffffb3; }

/* ---------- 卡片網格 ---------- */
main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 80px; }
.panel[hidden] { display: none; }
.panel-note { margin: 0 0 20px; color: var(--ink); font-size: 14px; line-height: 22px; }
.grid { display: grid; gap: 24px; }
.grid.mobile { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
.grid.full { grid-template-columns: 1fr; }

.card {
  background: var(--card);
  border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; display: flex; flex-direction: column;
}
.shot {
  position: relative; width: 100%;
  aspect-ratio: var(--ar); /* 每組一個比例，節內卡片才等高、標籤才對齊 */
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  overflow: hidden; cursor: zoom-in;
}
.shot iframe {
  position: absolute; top: 0; left: 0;
  border: 0; transform-origin: top left; pointer-events: none;
}
.shot .skeleton {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--faint); font-size: 13px;
}
.shot:hover::after {
  content: "點開看大圖";
  position: absolute; inset: auto 0 0 0; padding: 8px 12px;
  background: color-mix(in srgb, var(--ink) 88%, transparent);
  color: #fff; font-size: 13px; line-height: 20px; text-align: center;
}
.cap { padding: 12px 14px 14px; display: flex; gap: 10px; align-items: flex-start; }
.step {
  flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px; padding: 0 6px;
  background: var(--bg-soft); color: var(--ink);
  border-radius: 4px;
  font-size: 13px; line-height: 20px; font-weight: 700;
}
.cap h3 { margin: 0; font-size: 15px; line-height: 24px; font-weight: 700; }
.cap .sub { margin: 2px 0 0; font-size: 12px; line-height: 18px; color: var(--faint); }
.badge {
  display: inline-block; margin-left: 6px; padding: 0 6px;
  border: 1px solid var(--line-strong); border-radius: 4px;
  font-size: 11px; line-height: 16px; font-weight: 500; color: var(--muted);
  vertical-align: 2px;
}

/* ---------- 燈箱 ---------- */
.lb[hidden] { display: none; }
.lb {
  position: fixed; inset: 0; z-index: 50;
  background: color-mix(in srgb, var(--ink) 92%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 64px 16px 72px;
}
.lb-stage { background: var(--card); border-radius: 8px; overflow: hidden; position: relative; }
.lb-stage iframe { border: 0; display: block; transform-origin: top left; }
.lb-bar {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0;
  padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px;
  align-items: center; justify-content: center;
  color: #fff; font-size: 14px;
}
.lb-bar a { color: #fff; font-size: 13px; }
.lb-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  background: var(--card); color: var(--ink);
  border: 0; border-radius: 999px;
  font-size: 20px; font-family: inherit; cursor: pointer;
}
.lb-btn:hover { background: var(--bg-soft); }
.lb-prev { left: 16px; }
.lb-next { right: 16px; }
.lb-close {
  position: absolute; top: 16px; right: 16px;
  height: 36px; padding: 0 14px;
  background: var(--card); color: var(--ink);
  border: 0; border-radius: 8px;
  font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
}
.lb-close:hover { background: var(--bg-soft); }
.lb-hint { position: absolute; top: 16px; left: 20px; margin: 0; line-height: 36px; color: #fff; font-size: 13px; opacity: .7; }

@media (max-width: 640px) {
  header { padding: 32px 16px 20px; }
  h1 { font-size: 24px; line-height: 32px; }
  .tabs-inner, main { padding-left: 16px; padding-right: 16px; }
  .tabs-inner { flex-wrap: nowrap; overflow-x: auto; } /* 手機上分頁排一列、左右滑，sticky 列才不會吃掉半個畫面 */
  .tab { flex: none; }
  .grid.mobile { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.wide { grid-template-columns: 1fr; }
  .lb { padding: 56px 8px 64px; }
  .lb-btn { width: 40px; height: 40px; }
}
</style>
</head>
<body>

<header>
  <p class="brand">弘淇羽球</p>
  <h1>報名系統介面設計稿</h1>
</header>

<nav class="tabs" aria-label="介面分類">
  <div class="tabs-inner" id="tabs" role="tablist"></div>
</nav>

<main id="panels"></main>

<div class="lb" id="lb" hidden>
  <p class="lb-hint">← → 換頁・Esc 關閉</p>
  <button class="lb-close" type="button" id="lbClose">關閉</button>
  <button class="lb-btn lb-prev" type="button" id="lbPrev" aria-label="上一張">‹</button>
  <div class="lb-stage" id="lbStage"></div>
  <button class="lb-btn lb-next" type="button" id="lbNext" aria-label="下一張">›</button>
  <div class="lb-bar" id="lbBar"></div>
</div>

<script>
/* 資料來源：project/canvas.json。之後增刪畫板改這個陣列就好；hidden: true 的組先不顯示，拿掉就會回來。 */
const GROUPS = [
  {
    id: "minimal", label: "介面設計",
    grid: "mobile", w: 390, tallest: 1090,
    boards: [
      { file: "Main-Minimal-A.dc.html",  title: "版本A", h: 1040, live: true },
      { file: "Main-Minimal-B.dc.html",  title: "版本B", h: 1060, live: true },
      { file: "Main-Minimal-C1.dc.html", title: "版本C", h: 1060, live: true },
      { file: "Main-Minimal-C2.dc.html", title: "版本D", h: 1060, live: true },
      { file: "Main-Warm-N1.dc.html",    title: "版本E", h: 1090, live: true },
      { file: "Main-Warm-N2.dc.html",    title: "版本F", h: 1090, live: true },
      { file: "Main-Warm-N3.dc.html",    title: "版本G", h: 1090, live: true },
      { file: "Main-Warm-N4.dc.html",    title: "版本H", h: 1090, live: true }
    ]
  },
  {
    id: "flow", label: "系統流程圖", hidden: true,
    note: "五個角色 × 七個階段的泳道圖。實線是操作流程，虛線是資料同步；深藍框的方塊點了會跳到對應畫板。圖上標「待確認」的三件事要一起定案。",
    grid: "full", w: 2200, tallest: 1320,
    boards: [
      { file: "System-Flow.dc.html", title: "泳道圖・五個角色 × 七個階段", h: 1320, live: true }
    ]
  },
  {
    id: "mobile", label: "介面流程", note: "390px 寬，民眾在手機上看到的報名流程。",
    grid: "mobile", w: 390, tallest: 1320,
    boards: [
      { step: "1", file: "Main.dc.html",              title: "課程資訊・季報名", h: 1090, live: true },
      { step: "2", file: "BookingList-Mobile.dc.html", title: "預約列表・單堂",   h: 1240, live: true },
      { step: "3", file: "Checkout-Mobile.dc.html",    title: "結帳",            h: 1320, live: true },
      { step: "4", file: "Done-Mobile.dc.html",        title: "報名完成",         h: 860,  live: false },
      { step: "5", file: "Lookup-Mobile.dc.html",      title: "查詢",            h: 900,  live: true }
    ]
  },
  {
    id: "desktop", label: "前台・桌機", hidden: true, note: "1280px 寬，同一套流程的電腦版。",
    grid: "wide", w: 1280, tallest: 1060,
    boards: [
      { step: "1", file: "Courses-Desktop.dc.html",     title: "課程資訊・季報名", h: 930,  live: true },
      { step: "2", file: "BookingList-Desktop.dc.html", title: "預約列表・單堂",   h: 940,  live: true },
      { step: "3", file: "Checkout-Desktop.dc.html",    title: "結帳",            h: 1060, live: true },
      { step: "4", file: "Done-Desktop.dc.html",        title: "報名完成",         h: 780,  live: false },
      { step: "5", file: "Lookup-Desktop.dc.html",      title: "查詢",            h: 820,  live: true }
    ]
  },
  {
    id: "admin", label: "後台・桌機", hidden: true, note: "1440px 寬，中心內部管理用，側欄五個模組互通。",
    grid: "wide", w: 1440, tallest: 1000,
    boards: [
      { step: "A", file: "Admin-Courses.dc.html", title: "課程／時段管理", h: 1000, live: true },
      { step: "B", file: "Admin-Coaches.dc.html", title: "教練管理",      h: 880,  live: true },
      { step: "C", file: "Admin-Venues.dc.html",  title: "地點管理",      h: 760,  live: true },
      { step: "D", file: "Admin-Orders.dc.html",  title: "訂單管理",      h: 980,  live: true },
      { step: "E", file: "Admin-Account.dc.html", title: "帳號與登入",     h: 760,  live: false }
    ]
  }
];

const SHOWN = GROUPS.filter(g => !g.hidden);

// 燈箱的順序＝畫廊由上到下、由左到右的全域順序；FLAT 直接指向原物件。
// 同一張畫板可以出現在兩個分頁（例如版本C = 介面流程第 1 張），各自是獨立的項目。
GROUPS.forEach(g => g.boards.forEach(b => { b.group = g; }));
const FLAT = SHOWN.flatMap(g => g.boards);

// embed：燈箱裡的畫板把連結交給這頁處理（見 project/support.js）
function boardSrc(b, embed) {
  const q = new URLSearchParams();
  if (embed) q.set("embed", "1");
  const qs = q.toString();
  return "project/" + b.file + (qs ? "?" + qs : "");
}
const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");

SHOWN.forEach((g, gi) => {
  const tab = document.createElement("button");
  tab.className = "tab";
  tab.type = "button";
  tab.role = "tab";
  tab.id = "tab-" + g.id;
  tab.setAttribute("aria-controls", "panel-" + g.id);
  tab.setAttribute("aria-selected", String(gi === 0));
  tab.innerHTML = g.label + ' <span class="count">' + g.boards.length + "</span>";
  tab.addEventListener("click", () => select(gi));
  tabsEl.appendChild(tab);

  const panel = document.createElement("section");
  panel.className = "panel";
  panel.id = "panel-" + g.id;
  panel.role = "tabpanel";
  panel.setAttribute("aria-labelledby", tab.id);
  panel.hidden = gi !== 0;

  if (g.note) {
    const note = document.createElement("p");
    note.className = "panel-note";
    note.textContent = g.note;
    panel.appendChild(note);
  }

  const grid = document.createElement("div");
  grid.className = "grid " + g.grid;
  g.boards.forEach(b => grid.appendChild(card(g, b)));
  panel.appendChild(grid);
  panelsEl.appendChild(panel);
});

function card(g, b) {
  const el = document.createElement("article");
  el.className = "card";

  const shot = document.createElement("div");
  shot.className = "shot";
  shot.style.setProperty("--ar", g.w + " / " + g.tallest);
  shot.tabIndex = 0;
  shot.role = "button";
  shot.setAttribute("aria-label", "放大 " + b.title);

  const skel = document.createElement("span");
  skel.className = "skeleton";
  skel.textContent = "載入中…";
  shot.appendChild(skel);

  const open = () => openLightbox(FLAT.indexOf(b));
  shot.addEventListener("click", open);
  shot.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
  });
  el.appendChild(shot);

  const cap = document.createElement("div");
  cap.className = "cap";
  cap.innerHTML =
    (b.step ? '<span class="step">' + b.step + "</span>" : "") +
    "<div><h3>" + b.title +
    (b.live ? "" : '<span class="badge">靜態</span>') +
    "</h3>" +
    '<p class="sub">' + g.w + " × " + b.h + "</p></div>";
  el.appendChild(cap);

  // 縮圖只在該分頁第一次打開時才建 iframe，避免所有畫板同時載入
  el._mount = () => {
    if (el._mounted) return;
    el._mounted = true;
    const fr = document.createElement("iframe");
    fr.src = boardSrc(b, false);
    fr.width = g.w;
    fr.height = b.h;
    fr.loading = "lazy";
    fr.title = b.title;
    fr.addEventListener("load", () => skel.remove());
    shot.appendChild(fr);
    const fit = () => {
      const k = shot.clientWidth / g.w;
      fr.style.transform = "scale(" + k + ")";
    };
    fit();
    new ResizeObserver(fit).observe(shot);
  };
  return el;
}

function select(gi) {
  SHOWN.forEach((g, i) => {
    document.getElementById("tab-" + g.id).setAttribute("aria-selected", String(i === gi));
    const panel = document.getElementById("panel-" + g.id);
    panel.hidden = i !== gi;
    if (i === gi) panel.querySelectorAll(".card").forEach(c => c._mount());
  });
}
select(0);

/* ---------- 燈箱 ---------- */
const lb = document.getElementById("lb");
const lbStage = document.getElementById("lbStage");
const lbBar = document.getElementById("lbBar");
let cur = -1;

function openLightbox(i) {
  cur = (i + FLAT.length) % FLAT.length;
  const b = FLAT[cur];
  const g = b.group;

  lb.hidden = false;
  document.body.style.overflow = "hidden";
  lbStage.innerHTML = "";

  // 視窗放不下就等比縮小，放得下就維持原尺寸
  const maxW = window.innerWidth - (window.innerWidth > 640 ? 160 : 32);
  const maxH = window.innerHeight - (window.innerWidth > 640 ? 136 : 120);
  const k = Math.min(1, maxW / g.w, maxH / b.h);

  const fr = document.createElement("iframe");
  fr.src = boardSrc(b, true);
  fr.width = g.w;
  fr.height = b.h;
  fr.title = b.title;
  fr.style.transform = "scale(" + k + ")";
  lbStage.style.width = Math.round(g.w * k) + "px";
  lbStage.style.height = Math.round(b.h * k) + "px";
  lbStage.appendChild(fr);

  const label = document.createElement("span");
  label.textContent =
    (cur + 1) + " / " + FLAT.length + " ・ " + g.label + " " + (b.step ? b.step + " " : "") + b.title +
    (b.live ? "（可操作）" : "（靜態畫面）");
  const full = document.createElement("a");
  full.href = boardSrc(b, false);
  full.target = "_blank";
  full.rel = "noopener";
  full.textContent = "開新分頁看原尺寸";
  lbBar.replaceChildren(label);
  lbBar.appendChild(full);
}

// 燈箱裡的畫板點了連結（support.js 送來 dc:open）→ 換到那張畫板
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "dc:open") return;
  const fr = lbStage.querySelector("iframe");
  if (!fr || e.source !== fr.contentWindow) return;
  // 同一張畫板出現在兩個分頁時，優先留在目前這個分頁
  const here = FLAT.findIndex(x => x.file === e.data.file && x.group === FLAT[cur].group);
  const i = here >= 0 ? here : FLAT.findIndex(x => x.file === e.data.file);
  if (i >= 0) openLightbox(i);
});

function closeLightbox() {
  lb.hidden = true;
  lbStage.innerHTML = "";
  document.body.style.overflow = "";
  cur = -1;
}

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", () => openLightbox(cur - 1));
document.getElementById("lbNext").addEventListener("click", () => openLightbox(cur + 1));
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
window.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") openLightbox(cur - 1);
  else if (e.key === "ArrowRight") openLightbox(cur + 1);
});
window.addEventListener("resize", () => { if (!lb.hidden) openLightbox(cur); });
</script>
</body>
</html>
