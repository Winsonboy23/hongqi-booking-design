<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弘淇羽球報名系統 — 介面設計稿</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2c2cb' stroke='%232f4a6d' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
/* 色票直接取自 project/ds/hongqi/tokens.json 的淺色主題，畫廊與設計稿同一套 */
:root {
  --bg: #f0eae3;          /* surface-sunken：頁面底，比縮圖底深一階，卡片才浮得起來 */
  --bg-soft: #faf7f3;     /* surface-page：縮圖底＝畫板底色，接縫看不出來 */
  --card: #ffffff;        /* surface-card */
  --ink: #2f4a6d;         /* ink */
  --muted: #5c748f;       /* ink-muted */
  --outline: #2f4a6d;     /* outline：2px 描邊是這套風格的骨架 */
  --line: #ccd8e4;        /* outline-soft：只畫分隔線 */
  --accent: #f2c2cb;      /* blush：只當底色 */
  --accent-strong: #dd94a2;
  --accent-tint: #fbe8ec;
  --on-accent: #24405f;   /* ink-on-fill：落在填色上的文字 */
  --sky-tint: #e9f2f8;
  --tabbar-h: 60px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Zen Maru Gothic", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size: 15px;
  line-height: 26px;
}

/* ---------- 頁首 ---------- */
header { padding: 40px 24px 24px; max-width: 1400px; margin: 0 auto; }
.brand {
  font-family: "Caveat", cursive; font-size: 26px; line-height: 32px;
  font-weight: 600; color: var(--accent-strong); margin: 0 0 4px;
}
h1 { margin: 0 0 12px; font-size: 32px; line-height: 44px; font-weight: 700; }
h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--accent) 62%); }
.intro { margin: 0; max-width: 64ch; color: var(--muted); }
.intro + .intro { margin-top: 10px; }
.meta { margin: 16px 0 0; font-size: 13px; line-height: 20px; color: var(--muted); }

/* ---------- 分頁列 ---------- */
.tabs {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--outline);
}
.tabs-inner {
  max-width: 1400px; margin: 0 auto; padding: 10px 24px;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  min-height: var(--tabbar-h);
}
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px;
  background: var(--card); color: var(--ink);
  border: 2px solid var(--outline); border-radius: 12px;
  font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
}
.tab:hover { background: var(--sky-tint); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); box-shadow: 0 3px 0 var(--accent-strong); }
.tab .count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 22px; padding: 0 6px;
  background: var(--bg-soft); border-radius: 999px;
  font-size: 12px; line-height: 20px; color: var(--muted);
}
.tab[aria-selected="true"] .count { background: var(--card); color: var(--on-accent); }

/* ---------- 卡片網格 ---------- */
main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 80px; }
.panel[hidden] { display: none; }
.panel-note { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
.grid { display: grid; gap: 24px; }
.grid.mobile { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
.grid.full { grid-template-columns: 1fr; }

.card {
  background: var(--card);
  border: 2px solid var(--outline); border-radius: 16px;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 4px 0 var(--line);
}
.shot {
  position: relative; width: 100%;
  aspect-ratio: var(--ar); /* 每組一個比例，節內卡片才等高、標籤才對齊 */
  background: var(--bg-soft);
  border-bottom: 2px solid var(--outline);
  overflow: hidden; cursor: zoom-in;
}
.shot iframe {
  position: absolute; top: 0; left: 0;
  border: 0; transform-origin: top left; pointer-events: none;
}
.shot .skeleton {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 13px;
}
.shot:hover::after {
  content: "點開看大圖";
  position: absolute; inset: auto 0 0 0; padding: 8px 12px;
  background: color-mix(in srgb, var(--on-accent) 82%, transparent);
  color: #fff; font-size: 13px; line-height: 20px; text-align: center;
}
.cap { padding: 12px 14px 14px; display: flex; gap: 10px; align-items: flex-start; }
.step {
  flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 28px; padding: 0 8px;
  background: var(--accent); color: var(--on-accent);
  border: 2px solid var(--outline); border-radius: 8px;
  font-size: 14px; font-weight: 700;
}
.cap h3 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; }
.cap .sub { margin: 2px 0 0; font-size: 12px; line-height: 18px; color: var(--muted); }
.badge {
  display: inline-block; margin-left: 6px; padding: 0 7px;
  background: var(--sky-tint); border-radius: 6px;
  font-size: 11px; line-height: 18px; font-weight: 700; color: var(--muted);
  vertical-align: 2px;
}

/* ---------- Tweaks 色塊（簡約提案可切主色）---------- */
.swatches { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; line-height: 18px; color: var(--muted); }
.sw {
  width: 22px; height: 22px; padding: 0;
  background: var(--sw); border: 2px solid var(--card); border-radius: 999px;
  box-shadow: 0 0 0 1px var(--line); cursor: pointer;
}
.sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--outline); }
.sw-name { margin-left: 2px; }
.lb-bar .swatches { margin: 0; color: #fff; }
.lb-bar .sw { border-color: var(--on-accent); box-shadow: 0 0 0 1px #ffffff66; }
.lb-bar .sw[aria-checked="true"] { box-shadow: 0 0 0 2px #fff; }

/* ---------- 燈箱 ---------- */
.lb[hidden] { display: none; }
.lb {
  position: fixed; inset: 0; z-index: 50;
  background: color-mix(in srgb, var(--on-accent) 94%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 64px 16px 72px;
}
.lb-stage {
  background: var(--bg-soft);
  border: 2px solid var(--outline); border-radius: 16px;
  overflow: hidden; position: relative;
}
.lb-stage iframe { border: 0; display: block; transform-origin: top left; }
.lb-bar {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0;
  padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px;
  align-items: center; justify-content: center;
  color: #fff; font-size: 14px;
}
.lb-bar a { color: #fff; font-size: 13px; }
.lb-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px;
  background: var(--card); color: var(--ink);
  border: 2px solid var(--outline); border-radius: 999px;
  font-size: 20px; font-family: inherit; cursor: pointer;
}
.lb-btn:hover { background: var(--accent); }
.lb-prev { left: 16px; }
.lb-next { right: 16px; }
.lb-close {
  position: absolute; top: 16px; right: 16px;
  height: 40px; padding: 0 16px;
  background: var(--card); color: var(--ink);
  border: 2px solid var(--outline); border-radius: 12px;
  font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
}
.lb-hint { position: absolute; top: 22px; left: 20px; color: #fff; font-size: 13px; opacity: .8; }

@media (max-width: 640px) {
  header { padding: 28px 16px 16px; }
  h1 { font-size: 26px; line-height: 36px; }
  .tabs-inner, main { padding-left: 16px; padding-right: 16px; }
  .grid.mobile { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.wide { grid-template-columns: 1fr; }
  .lb { padding: 56px 8px 64px; }
  .lb-btn { width: 40px; height: 40px; }
}
</style>
</head>
<body>

<header>
  <p class="brand">弘淇羽球</p>
  <h1>報名系統 <em>介面設計稿</em></h1>
  <p class="intro">18 張畫板：前台手機、前台桌機、後台三組介面，加上兩版簡約風格提案與一張系統流程圖。點縮圖可以放大，放大後的畫面是能真的操作的——下拉、月曆、展開都會動，按鈕和連結也會跳到對應的畫板。</p>
  <p class="intro">可點的流程：選地區 → 選館別 → 點月曆日期 → 報名 → 結帳（切統編會即時 +5%）→ 完成 → 查詢。後台側欄五個模組互通。</p>
  <p class="meta">2026-09-22 更新：新增簡約風格提案 A・B 與系統流程圖・畫面裡的館別、教練、課名、價格、訂單全是示意資料</p>
</header>

<nav class="tabs" aria-label="介面分類">
  <div class="tabs-inner" id="tabs" role="tablist"></div>
</nav>

<main id="panels"></main>

<div class="lb" id="lb" hidden>
  <p class="lb-hint">← → 換頁・Esc 關閉</p>
  <button class="lb-close" type="button" id="lbClose">關閉</button>
  <button class="lb-btn lb-prev" type="button" id="lbPrev" aria-label="上一張">‹</button>
  <div class="lb-stage" id="lbStage"></div>
  <button class="lb-btn lb-next" type="button" id="lbNext" aria-label="下一張">›</button>
  <div class="lb-bar" id="lbBar"></div>
</div>

<script>
/* 資料來源：project/canvas.json。之後增刪畫板改這個陣列就好。 */
const GROUPS = [
  {
    id: "mobile", label: "前台・手機", note: "390px 寬，民眾在手機上看到的報名流程。",
    grid: "mobile", w: 390, tallest: 1320,
    boards: [
      { step: "1", file: "Main.dc.html",              title: "課程資訊・季報名", h: 1090, live: true },
      { step: "2", file: "BookingList-Mobile.dc.html", title: "預約列表・單堂",   h: 1240, live: true },
      { step: "3", file: "Checkout-Mobile.dc.html",    title: "結帳",            h: 1320, live: true },
      { step: "4", file: "Done-Mobile.dc.html",        title: "報名完成",         h: 860,  live: false },
      { step: "5", file: "Lookup-Mobile.dc.html",      title: "查詢",            h: 900,  live: true }
    ]
  },
  {
    id: "desktop", label: "前台・桌機", note: "1280px 寬，同一套流程的電腦版。",
    grid: "wide", w: 1280, tallest: 1060,
    boards: [
      { step: "1", file: "Courses-Desktop.dc.html",     title: "課程資訊・季報名", h: 930,  live: true },
      { step: "2", file: "BookingList-Desktop.dc.html", title: "預約列表・單堂",   h: 940,  live: true },
      { step: "3", file: "Checkout-Desktop.dc.html",    title: "結帳",            h: 1060, live: true },
      { step: "4", file: "Done-Desktop.dc.html",        title: "報名完成",         h: 780,  live: false },
      { step: "5", file: "Lookup-Desktop.dc.html",      title: "查詢",            h: 820,  live: true }
    ]
  },
  {
    id: "admin", label: "後台・桌機", note: "1440px 寬，中心內部管理用，側欄五個模組互通。",
    grid: "wide", w: 1440, tallest: 1000,
    boards: [
      { step: "A", file: "Admin-Courses.dc.html", title: "課程／時段管理", h: 1000, live: true },
      { step: "B", file: "Admin-Coaches.dc.html", title: "教練管理",      h: 880,  live: true },
      { step: "C", file: "Admin-Venues.dc.html",  title: "地點管理",      h: 760,  live: true },
      { step: "D", file: "Admin-Orders.dc.html",  title: "訂單管理",      h: 980,  live: true },
      { step: "E", file: "Admin-Account.dc.html", title: "帳號與登入",     h: 760,  live: false }
    ]
  },
  {
    id: "minimal", label: "簡約風格提案",
    note: "課程資訊頁的兩種新視覺。資料和操作都跟原稿（前台・手機第 1 張）相同，只換風格；點色塊可以切換主色。選定之後，其餘畫板會跟著換成同一套。",
    grid: "mobile", w: 390, tallest: 1060,
    boards: [
      { step: "A", file: "Main-Minimal-A.dc.html", title: "清爽", h: 1040, live: true,
        tweak: { key: "primary", label: "主色", options: [["#2f4a6d", "深藍"], ["#1f5f4a", "墨綠"], ["#2b2f36", "炭灰"]] } },
      { step: "B", file: "Main-Minimal-B.dc.html", title: "運動", h: 1060, live: true,
        tweak: { key: "accent", label: "強調色", options: [["#d4f24a", "萊姆綠"], ["#7ee0b0", "薄荷綠"], ["#ffd84d", "羽球黃"]] } }
    ]
  },
  {
    id: "flow", label: "系統流程圖",
    note: "五個角色 × 七個階段的泳道圖。實線是操作流程，虛線是資料同步；深藍框的方塊點了會跳到對應畫板。圖上標「待確認」的三件事要一起定案。",
    grid: "full", w: 2200, tallest: 1320,
    boards: [
      { file: "System-Flow.dc.html", title: "泳道圖・五個角色 × 七個階段", h: 1320, live: true }
    ]
  }
];

// 燈箱的順序＝畫廊由上到下、由左到右的全域順序；FLAT 直接指向原物件，換色時兩邊同步
GROUPS.forEach(g => g.boards.forEach(b => {
  b.group = g;
  if (b.tweak) b.tweakVal = b.tweak.options[0][0];
}));
const FLAT = GROUPS.flatMap(g => g.boards);

// embed：燈箱裡的畫板把連結交給這頁處理（見 project/support.js）
function boardSrc(b, embed) {
  const q = new URLSearchParams();
  if (embed) q.set("embed", "1");
  if (b.tweak) q.set(b.tweak.key, b.tweakVal);
  const qs = q.toString();
  return "project/" + b.file + (qs ? "?" + qs : "");
}
const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");

GROUPS.forEach((g, gi) => {
  const tab = document.createElement("button");
  tab.className = "tab";
  tab.type = "button";
  tab.role = "tab";
  tab.id = "tab-" + g.id;
  tab.setAttribute("aria-controls", "panel-" + g.id);
  tab.setAttribute("aria-selected", String(gi === 0));
  tab.innerHTML = g.label + ' <span class="count">' + g.boards.length + "</span>";
  tab.addEventListener("click", () => select(gi));
  tabsEl.appendChild(tab);

  const panel = document.createElement("section");
  panel.className = "panel";
  panel.id = "panel-" + g.id;
  panel.role = "tabpanel";
  panel.setAttribute("aria-labelledby", tab.id);
  panel.hidden = gi !== 0;

  const note = document.createElement("p");
  note.className = "panel-note";
  note.textContent = g.note;
  panel.appendChild(note);

  const grid = document.createElement("div");
  grid.className = "grid " + g.grid;
  g.boards.forEach(b => grid.appendChild(card(g, b)));
  panel.appendChild(grid);
  panelsEl.appendChild(panel);
});

function card(g, b) {
  const el = document.createElement("article");
  el.className = "card";

  const shot = document.createElement("div");
  shot.className = "shot";
  shot.style.setProperty("--ar", g.w + " / " + g.tallest);
  shot.tabIndex = 0;
  shot.role = "button";
  shot.setAttribute("aria-label", "放大 " + b.title);

  const skel = document.createElement("span");
  skel.className = "skeleton";
  skel.textContent = "載入中…";
  shot.appendChild(skel);

  const open = () => openLightbox(FLAT.findIndex(x => x.file === b.file));
  shot.addEventListener("click", open);
  shot.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
  });
  el.appendChild(shot);

  const cap = document.createElement("div");
  cap.className = "cap";
  cap.innerHTML =
    (b.step ? '<span class="step">' + b.step + "</span>" : "") +
    "<div><h3>" + b.title +
    (b.live ? "" : '<span class="badge">靜態</span>') +
    "</h3>" +
    '<p class="sub">' + g.w + " × " + b.h + "</p></div>";
  if (b.tweak) cap.lastChild.appendChild(b._cardSw = swatches(b));
  el.appendChild(cap);

  // 縮圖只在該分頁第一次打開時才建 iframe，避免所有畫板同時載入
  el._mount = () => {
    if (el._mounted) return;
    el._mounted = true;
    const fr = document.createElement("iframe");
    b._thumb = fr;
    fr.src = boardSrc(b, false);
    fr.width = g.w;
    fr.height = b.h;
    fr.loading = "lazy";
    fr.title = b.title;
    fr.addEventListener("load", () => skel.remove());
    shot.appendChild(fr);
    const fit = () => {
      const k = shot.clientWidth / g.w;
      fr.style.transform = "scale(" + k + ")";
    };
    fit();
    new ResizeObserver(fit).observe(shot);
  };
  return el;
}

// 色塊：卡片與燈箱共用，換色後兩邊一起更新
function swatches(b) {
  const wrap = document.createElement("div");
  wrap.className = "swatches";
  wrap.setAttribute("role", "radiogroup");
  wrap.setAttribute("aria-label", b.tweak.label);
  b.tweak.options.forEach(([hex, name]) => {
    const s = document.createElement("button");
    s.type = "button";
    s.className = "sw";
    s.style.setProperty("--sw", hex);
    s.title = name;
    s.setAttribute("role", "radio");
    s.setAttribute("aria-label", b.tweak.label + "：" + name);
    s.setAttribute("aria-checked", String(hex === b.tweakVal));
    s.addEventListener("click", () => pickTweak(b, hex));
    wrap.appendChild(s);
  });
  const name = document.createElement("span");
  name.className = "sw-name";
  name.textContent = b.tweak.label + "：" + b.tweak.options.find(o => o[0] === b.tweakVal)[1];
  wrap.appendChild(name);
  return wrap;
}

function pickTweak(b, hex) {
  if (hex === b.tweakVal) return;
  b.tweakVal = hex;
  if (b._thumb) b._thumb.src = boardSrc(b, false);
  if (b._cardSw) {
    const next = swatches(b);
    b._cardSw.replaceWith(next);
    b._cardSw = next;
  }
  if (!lb.hidden && FLAT[cur] === b) openLightbox(cur);
}

function select(gi) {
  GROUPS.forEach((g, i) => {
    document.getElementById("tab-" + g.id).setAttribute("aria-selected", String(i === gi));
    const panel = document.getElementById("panel-" + g.id);
    panel.hidden = i !== gi;
    if (i === gi) panel.querySelectorAll(".card").forEach(c => c._mount());
  });
}
select(0);

/* ---------- 燈箱 ---------- */
const lb = document.getElementById("lb");
const lbStage = document.getElementById("lbStage");
const lbBar = document.getElementById("lbBar");
let cur = -1;

function openLightbox(i) {
  cur = (i + FLAT.length) % FLAT.length;
  const b = FLAT[cur];
  const g = b.group;

  lb.hidden = false;
  document.body.style.overflow = "hidden";
  lbStage.innerHTML = "";

  // 視窗放不下就等比縮小，放得下就維持原尺寸
  const maxW = window.innerWidth - (window.innerWidth > 640 ? 160 : 32);
  const maxH = window.innerHeight - (window.innerWidth > 640 ? 136 : 120);
  const k = Math.min(1, maxW / g.w, maxH / b.h);

  const fr = document.createElement("iframe");
  fr.src = boardSrc(b, true);
  fr.width = g.w;
  fr.height = b.h;
  fr.title = b.title;
  fr.style.transform = "scale(" + k + ")";
  lbStage.style.width = Math.round(g.w * k) + "px";
  lbStage.style.height = Math.round(b.h * k) + "px";
  lbStage.appendChild(fr);

  const label = document.createElement("span");
  label.textContent =
    (cur + 1) + " / " + FLAT.length + " ・ " + g.label + " " + (b.step ? b.step + " " : "") + b.title +
    (b.live ? "（可操作）" : "（靜態畫面）");
  const full = document.createElement("a");
  full.href = boardSrc(b, false);
  full.target = "_blank";
  full.rel = "noopener";
  full.textContent = "開新分頁看原尺寸";
  lbBar.replaceChildren(label);
  if (b.tweak) lbBar.appendChild(swatches(b));
  lbBar.appendChild(full);
}

// 燈箱裡的畫板點了連結（support.js 送來 dc:open）→ 換到那張畫板
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "dc:open") return;
  const fr = lbStage.querySelector("iframe");
  if (!fr || e.source !== fr.contentWindow) return;
  const i = FLAT.findIndex(x => x.file === e.data.file);
  if (i >= 0) openLightbox(i);
});

function closeLightbox() {
  lb.hidden = true;
  lbStage.innerHTML = "";
  document.body.style.overflow = "";
  cur = -1;
}

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", () => openLightbox(cur - 1));
document.getElementById("lbNext").addEventListener("click", () => openLightbox(cur + 1));
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
window.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") openLightbox(cur - 1);
  else if (e.key === "ArrowRight") openLightbox(cur + 1);
});
window.addEventListener("resize", () => { if (!lb.hidden) openLightbox(cur); });
</script>
</body>
</html>
